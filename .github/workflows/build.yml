name: 📱 Build Kivy APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 📥 Baixar código do repositório
        uses: actions/checkout@v4

      - name: ☕ Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 🐍 Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Instalar dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git ffmpeg zlib1g-dev libffi-dev libssl-dev \
            autoconf automake autopoint libtool libltdl-dev pkg-config \
            cmake ccache lbzip2 unzip zip patch wget

      - name: 🧹 Limpar variáveis de compilação
        run: |
          unset CC CXX CFLAGS CPPFLAGS C_INCLUDE_PATH CPLUS_INCLUDE_PATH CPATH LDFLAGS

      - name: 📦 Atualizar pip
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: ⚙️ Instalar Buildozer e Cython
        run: |
          python -m pip install buildozer cython==0.29.36

      # ============================================================
      # CACHE DO BUILDOZER (Essencial para não estourar o tempo limite)
      # ============================================================
      - name: 💾 Cache do Buildozer
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}-${{ hashFiles('*.py') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: 🔍 Verificar ambiente
        run: |
          python --version
          buildozer --version
          java -version

      - name: 🚀 Compilar APK
        env:
          BUILDOZER_WARN_ON_ROOT: "1"
        run: |
          buildozer -v android debug

      - name: 🔎 Verificar APK
        if: success()
        run: |
          ls -lah bin/
          find bin -type f -name "*.apk" -print

      - name: 📤 Enviar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pacote-apk
          path: bin/*.apk
          if-no-files-found: error
