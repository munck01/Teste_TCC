name: 📱 Build Kivy APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Baixar código do repositório
      uses: actions/checkout@v4

    - name: ☕ Configurar Java (OpenJDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 🐍 Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 📦 Instalar dependências do sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3-pip \
          build-essential \
          git \
          python3-dev \
          ffmpeg \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          libffi-dev \
          libssl-dev

    - name: ⚙️ Instalar Buildozer e Cython
      run: |
        pip3 install --upgrade pip
        pip3 install --upgrade cython==0.29.36 buildozer

    - name: 🚀 Compilar APK com Buildozer
      run: |
        buildozer android debug

    - name: 📤 Enviar APK gerado para download
      uses: actions/upload-artifact@v4
      with:
        name: pacote-apk
        path: bin/*.apk
