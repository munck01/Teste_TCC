name: 📱 Build Kivy APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 📥 Baixar código do repositório
        uses: actions/checkout@v4

      - name: ☕ Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Instalar dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            ffmpeg \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            autoconf \
            automake \
            libtool \
            libltdl-dev \
            pkg-config

      - name: 🧹 Limpar variáveis de compilação
        run: |
          unset CC
          unset CXX
          unset CFLAGS
          unset CPPFLAGS
          unset C_INCLUDE_PATH
          unset CPLUS_INCLUDE_PATH
          unset CPATH
          unset LDFLAGS

      - name: ⚙️ Instalar Buildozer e Cython
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython==0.29.36

      - name: 🧹 Limpar build anterior
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: 🚀 Compilar APK
        run: |
          buildozer -v android debug

      - name: 📤 Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: pacote-apk
          path: bin/*.apk
