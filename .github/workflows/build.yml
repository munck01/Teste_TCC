name: 📱 Build Kivy APK

on:
  push:
    branches: [ main ]

  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # Código
      # ============================================================

      - name: 📥 Baixar código do repositório
        uses: actions/checkout@v4


      # ============================================================
      # Java
      # ============================================================

      - name: ☕ Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # Python
      # ============================================================

      - name: 🐍 Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'


      # ============================================================
      # Dependências do sistema
      # ============================================================

      - name: 📦 Instalar dependências do sistema
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            ffmpeg \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            autoconf \
            automake \
            autopoint \
            libtool \
            libltdl-dev \
            pkg-config \
            cmake \
            ccache \
            lbzip2 \
            unzip \
            zip \
            patch \
            wget


      # ============================================================
      # Limpar ambiente de compilação
      # ============================================================

      - name: 🧹 Limpar variáveis de compilação
        run: |
          unset CC
          unset CXX
          unset CFLAGS
          unset CPPFLAGS
          unset C_INCLUDE_PATH
          unset CPLUS_INCLUDE_PATH
          unset CPATH
          unset LDFLAGS


      # ============================================================
      # Python packages
      # ============================================================

      - name: 📦 Atualizar pip
        run: |
          python -m pip install --upgrade pip setuptools wheel


      - name: ⚙️ Instalar Buildozer e Cython
        run: |
          python -m pip install \
            buildozer \
            cython==0.29.36


      # ============================================================
      # Limpar builds antigos
      # ============================================================

      - name: 🧹 Limpar build anterior
        run: |
          rm -rf .buildozer
          rm -rf bin


      # ============================================================
      # Diagnóstico
      # ============================================================

      - name: 🔍 Verificar ambiente
        run: |
          echo "===== Python ====="
          python --version

          echo "===== Pip ====="
          python -m pip --version

          echo "===== Buildozer ====="
          buildozer --version

          echo "===== Java ====="
          java -version

          echo "===== Cython ====="
          cython --version

          echo "===== CMake ====="
          cmake --version

          echo "===== GCC ====="
          gcc --version


      # ============================================================
      # Build
      # ============================================================

      - name: 🚀 Compilar APK
        env:
          BUILDOZER_WARN_ON_ROOT: "1"
        run: |
          buildozer -v android debug


      # ============================================================
      # Verificar resultado
      # ============================================================

      - name: 🔎 Verificar APK
        if: success()
        run: |
          echo "===== Arquivos gerados ====="
          ls -lah bin/

          echo "===== APK ====="
          find bin -type f -name "*.apk" -print


      # ============================================================
      # Upload
      # ============================================================

      - name: 📤 Enviar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pacote-apk
          path: bin/*.apk
          if-no-files-found: error
